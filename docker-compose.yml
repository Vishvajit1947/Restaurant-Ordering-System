name: restaurant-ordering

# Full stack:   docker compose up --build        -> http://localhost:3000
# Database only (for local development):  docker compose up -d db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://restaurant:restaurant@db:5432/restaurant
      JWT_SECRET: ${JWT_SECRET:-change-this-long-random-secret-before-deploying-1234567890}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: "true"
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
